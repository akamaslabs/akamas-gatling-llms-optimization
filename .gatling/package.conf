# Gatling Enterprise deployment descriptor (Configuration as Code).
# Docs: https://docs.gatling.io/reference/execute/cloud/user/configuration-as-code
#
# Packages the SAME open-source simulation (src/vllmConcurrencySweep.gatling.ts) and
# runs it on Gatling Enterprise. Load generators run on the in-cluster Kubernetes
# PRIVATE LOCATION (k8s/gatling-control-plane/) -- a managed cloud location cannot
# reach vllm.llm-serving.svc.cluster.local. The control plane turns each run into a
# Kubernetes batch Job in the cluster, satisfying the "load test must run as a Job in
# the cluster" requirement.
#
# Deploy ONCE (creates/updates the simulation, prints its test_... id):
#   k8s/deploy_enterprise.sh   (GATLING_ENTERPRISE_API_TOKEN set; needs Node)
# Trigger each experiment (Akamas RunTest step, by simulation id, no Node):
#   k8s/run_test_enterprise.sh (GATLING_ENTERPRISE_API_TOKEN + GATLING_SIMULATION_ID),
#   which calls Gatling's official start_simulation.sh against api.gatling.io.

gatling.enterprise.package {
  # `id` is assigned by Gatling Enterprise on the first `enterprise-deploy` and printed
  # in its output. Paste it back here to make re-deploys idempotent (update-in-place).
  # id = "package_xxxxxxxxxxxxxxxxxxxxxxxxxx"
  name = "akamas-gatling-llms-optimization"
  # `team` is OPTIONAL and deliberately omitted. Per the config-as-code reference, when
  # it is absent the package is assigned to "the only team specified in the API Token",
  # or "the only team in the organization if the API Token has a global role" — which
  # covers this setup. Leaving the old `<your Gatling Enterprise team>` placeholder in
  # place would NOT have been harmless: it is a literal string, so the deploy fails
  # looking for a team by that name.
  # Set it explicitly only if the deploy complains the team is ambiguous (more than one
  # team reachable by the token); the API Token then needs Configure on that team.

  default {
    simulation {
      # In-cluster Kubernetes private location defined by the control plane. For a
      # private location the descriptor key is `name` and its value is the Private
      # Location ID (per the config-as-code reference) -- it MUST match locations[].id
      # in k8s/gatling-control-plane/control-plane.conf.
      locations = [
        { name = "prl_akamas_vllm_k8s", size = 1, weight = 100 }
      ]
      parameters {
        systemProperties {
          # Cluster-internal vLLM Service URL (reachable from the in-cluster generator).
          "base.url" = "http://vllm.llm-serving.svc.cluster.local:8000"
          # MUST match --served-model-name in k8s/01-deployment_template.yaml. When you
          # switch model for the H100 run, change it in BOTH places.
          "model" = "qwen2.5-7b"
          # Load-generator health gate (see the simulation's assertions): fail the run
          # if too many requests error, so Akamas never scores a broken generator.
          "assert.maxFailedPercent" = "5"
        }
      }
      # The sweep has no ramp; keep the whole run in the assertion/percentile window.
      timeWindow { rampUp = 0, rampDown = 0 }
    }
  }

  simulations = [
    {
      name = "vLLM goodput concurrency sweep"
      simulation = "vllmConcurrencySweep"
    }
  ]
}
