kind: system
name: vLLM_Benchmark_2_Gemma4_L40S_Kernels_Gatling
description: >-
  Study 2 of akamas-gatling-llms-optimization: kernel backends of
  RedHatAI/gemma-4-26B-A4B-it-FP8-dynamic (vllm/vllm-openai:v0.29.0, served as
  gemma4-26b-l40s) on one NVIDIA L40S 48 GB (g6e.xlarge, node group llm-serving-l40s of the
  vllm-bench-gatling cluster): MoE, linear and attention backends, tuned fused-MoE configs, KV
  dtype and batch knobs. Goal: total tokens/s under TTFT p95 <= 1.5 s and ITL p95 <= 300 ms,
  with an open-loop Gatling Enterprise ramp on ShareGPT. Requires vLLM pack 1.13.0 (moe_backend),
  GPU pack, Kubernetes pack. Created 2026-10-08.
