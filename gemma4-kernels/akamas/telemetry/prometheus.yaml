  datasourceMetric: '(histogram_quantile(0.95, sum by(le)(rate(vllm:request_decode_time_seconds_bucket{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$]))))*1000'
  scale: 1
- metric: request_queue_time_avg
  datasourceMetric: '(sum(rate(vllm:request_queue_time_seconds_sum{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:request_queue_time_seconds_count{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9))*1000'
  scale: 1
- metric: k8s_cluster_nodes
  datasourceMetric: 'count(kube_node_labels{label_node_role=~"$NODEROLE$"})'
- metric: k8s_cluster_cpu
  datasourceMetric: 'sum(kube_node_status_capacity{resource="cpu"} * on(node) group_left() kube_node_labels{label_node_role=~"$NODEROLE$"})'
- metric: k8s_cluster_cpu_available
  datasourceMetric: 'sum(kube_node_status_allocatable{resource="cpu"} * on(node) group_left() kube_node_labels{label_node_role=~"$NODEROLE$"})'
- metric: k8s_cluster_cpu_request
  datasourceMetric: 'sum(sum by(node)(kube_pod_container_resource_requests{resource="cpu"}) * on(node) group_left() kube_node_labels{label_node_role=~"$NODEROLE$"})'
- metric: k8s_cluster_cpu_util
  datasourceMetric: 'sum(sum by(node)(rate(container_cpu_usage_seconds_total{container!=""}[2m])) * on(node) group_left() kube_node_labels{label_node_role=~"$NODEROLE$"}) / clamp_min(sum(kube_node_status_capacity{resource="cpu"} * on(node) group_left() kube_node_labels{label_node_role=~"$NODEROLE$"}), 1e-9)'
- metric: k8s_cluster_memory
  datasourceMetric: 'sum(kube_node_status_capacity{resource="memory"} * on(node) group_left() kube_node_labels{label_node_role=~"$NODEROLE$"})'
- metric: k8s_cluster_memory_available
  datasourceMetric: 'sum(kube_node_status_allocatable{resource="memory"} * on(node) group_left() kube_node_labels{label_node_role=~"$NODEROLE$"})'
- metric: k8s_cluster_memory_request
  datasourceMetric: 'sum(sum by(node)(kube_pod_container_resource_requests{resource="memory"}) * on(node) group_left() kube_node_labels{label_node_role=~"$NODEROLE$"})'
- metric: k8s_cluster_memory_util
  datasourceMetric: 'sum(sum by(node)(container_memory_working_set_bytes{container!=""}) * on(node) group_left() kube_node_labels{label_node_role=~"$NODEROLE$"}) / clamp_min(sum(kube_node_status_capacity{resource="memory"} * on(node) group_left() kube_node_labels{label_node_role=~"$NODEROLE$"}), 1e-9)'
# STUDY 30: Gemma 4 MTP speculative decoding (vLLM pack 1.10.0+ metric names; vLLM counters
# vllm:spec_decode_num_drafts / num_draft_tokens / num_accepted_tokens, exposed with _total).
# The series exist only while speculative decoding is configured: `or vector(0)` makes them 0
# with spec_method none, so the KPI and the analysis always have a value.
- metric: spec_decode_drafts_rate
  datasourceMetric: 'sum(rate(vllm:spec_decode_num_drafts_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) or vector(0)'
- metric: spec_decode_draft_tokens_rate
  datasourceMetric: 'sum(rate(vllm:spec_decode_num_draft_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) or vector(0)'
- metric: spec_decode_accepted_tokens_rate
  datasourceMetric: 'sum(rate(vllm:spec_decode_num_accepted_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) or vector(0)'
- metric: spec_decode_acceptance_rate
  datasourceMetric: '(sum(rate(vllm:spec_decode_num_accepted_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:spec_decode_num_draft_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9)) or vector(0)'
- metric: spec_decode_accepted_tokens_per_draft
  datasourceMetric: '(sum(rate(vllm:spec_decode_num_accepted_tokens_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])) / clamp_min(sum(rate(vllm:spec_decode_num_drafts_total{model_name=~"$MODEL$", pod=~"$POD$"}[$DURATION$])), 1e-9)) or vector(0)'
