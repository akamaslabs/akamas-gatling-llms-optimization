gatling {
  http {
    # Default is 60000 (60s) — confirmed too low from a real run (2026-08-17): under real
    # saturation, requests routinely take longer than 60s to complete, and Gatling's
    # timeout doesn't cancel the request server-side, it just abandons it and frees the
    # virtual user's slot — which then gets replaced by a new one to maintain the level's
    # nominal concurrency. That silently pushes real concurrent load on vLLM above the
    # sweep's intended level, corrupting the exact closed-loop invariant this project is
    # built around (see src/vllmConcurrencySweep.gatling.ts and README "Closed-loop load
    # model"). Raised well above any realistic worst-case response time so it acts as a
    # dead-connection safety net, not a normal-latency ceiling — AIPerf's own closed-loop
    # client has no equivalent artificial cutoff at all.
    requestTimeout = 600000
  }
}
