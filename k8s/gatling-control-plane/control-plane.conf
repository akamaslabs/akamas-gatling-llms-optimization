# Gatling Enterprise control plane configuration for the in-cluster Kubernetes
# private location.
# Docs: https://docs.gatling.io/reference/deploy/private-locations/kubernetes/
#
# This control plane runs in-cluster (see deployment.yaml). It polls Gatling
# Enterprise, and for each run it CREATES A KUBERNETES BATCH JOB in `namespace`
# below (plus a backing ConfigMap), streams its logs, and deletes it when the run
# ends -- i.e. the load test runs as a Job inside this cluster, next to vLLM,
# reaching it over internal Service DNS. That in-cluster-Job property is the whole
# reason for a private location here rather than managed cloud load generators,
# which cannot reach vllm.llm-serving.svc.cluster.local.
#
# The token is injected from a Secret via CONTROL_PLANE_TOKEN (see
# secret.example.yaml + deployment.yaml) so it never lands in the ConfigMap or in
# git -- same discipline as akamas/id_rsa.
control-plane {
  token = ${?CONTROL_PLANE_TOKEN}
  description = "Akamas vLLM optimization - in-cluster Kubernetes control plane"

  locations = [
    {
      id = "prl_akamas_vllm_k8s"
      description = "In-cluster load generators for the vLLM goodput study"
      type = "kubernetes"

      # Namespace the load-generator Jobs are created in. Reuses the same namespace
      # as the raw-Job fallback (k8s/job.yaml) so RBAC and quotas stay in one place.
      namespace = "llm-benchmark"

      # The simulation is TypeScript (@gatling.io/*), so the JS engine. Per the
      # Gatling docs the JS engine supports the `latest` certified image only.
      engine = "javascript"

      image {
        type = certified
        java = latest
      }

      # Per-generator pod spec (resources, scheduling). Kept in job.json so it can
      # be tuned without touching this file. See k8s/gatling-control-plane/README.md
      # for the resource-sizing caveat -- the raw Job's floor is NOT yet verified at
      # 1024 closed-loop VUs on a JS event loop.
      job = { include "job.json" }

      # Defaults for every run on this location; the package's own systemProperties
      # (.gatling/package.conf) override these per simulation.
      system-properties {
        "base.url" = "http://vllm.llm-serving.svc.cluster.local:8000"
      }
    }
  ]
}
