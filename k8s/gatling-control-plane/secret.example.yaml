# EXAMPLE ONLY -- do NOT commit a real token. Same discipline as akamas/id_rsa.
#
# Get the control-plane token from Gatling Enterprise:
#   Admin > Private Locations > Control Planes > (create one) > copy the token
#   (shown only once, prefixed `cpt_`).
#
# Then create the real Secret manually (do not `kubectl apply` this example file):
#   kubectl create secret generic gatling-control-plane-token \
#     -n llm-benchmark \
#     --from-literal=token="cpt_...your_token..."
apiVersion: v1
kind: Secret
metadata:
  name: gatling-control-plane-token
  namespace: llm-benchmark
type: Opaque
stringData:
  token: "REPLACE_WITH_CONTROL_PLANE_TOKEN"
